<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>استمارة تسجيل الطلاب - مدرسة الصفوة الثانوية الخاصة</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --navy: #0a1426;
            --navy-light: #13223d;
            --gold: #e5a922;
            --gold-hover: #c99116;
            --white: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background: linear-gradient(135deg, var(--navy) 0%, var(--navy-light) 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .form-container {
            background: var(--white);
            width: 100%;
            max-width: 560px;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            border-top: 6px solid var(--gold);
        }

        .header {
            background-color: var(--navy);
            color: var(--white);
            text-align: center;
            padding: 25px 20px;
            border-bottom: 3px solid var(--gold);
        }

        .header img {
            width: 110px;
            height: auto;
            margin-bottom: 10px;
        }

        .header h1 {
            font-size: 1.4rem;
            color: var(--gold);
            font-weight: 800;
            margin-bottom: 5px;
        }

        .header p {
            font-size: 0.95rem;
            color: #d1d5db;
        }

        .form-body {
            padding: 30px 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: 700;
            color: var(--navy);
            margin-bottom: 8px;
            font-size: 0.95rem;
        }

        .form-group label span.required {
            color: #dc2626;
        }

        .form-control {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 1rem;
            color: #1e293b;
            transition: all 0.3s ease;
            background-color: #f8fafc;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--gold);
            background-color: var(--white);
            box-shadow: 0 0 0 3px rgba(229, 169, 34, 0.2);
        }

        select.form-control {
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
            cursor: pointer;
            font-weight: 600;
            color: var(--navy);
            padding-left: 40px;
            background-image: url("data:image/svg+xml;utf8,<svg fill='%230a1426' height='24' viewBox='0 0 24 24' width='24' xmlns='http://www.w3.org/2000/svg'><path d='M7 10l5 5 5-5z'/></svg>");
            background-repeat: no-repeat;
            background-position: left 12px center;
            background-size: 24px;
        }

        .sub-box {
            background-color: #fffbeb;
            border: 1.5px solid #fcd34d;
            border-radius: 12px;
            padding: 18px 16px;
            margin-bottom: 20px;
            display: none;
        }

        .sub-box.active {
            display: block;
            animation: fadeIn 0.25s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(to left, var(--gold), #f3be42);
            color: var(--navy);
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 800;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
        }

        .btn-submit:hover:not(:disabled) {
            background: var(--gold-hover);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(229, 169, 34, 0.4);
        }

        .btn-submit:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .status-msg {
            display: none;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            font-weight: 700;
            margin-top: 15px;
        }

        .success-msg {
            background-color: #dcfce7;
            color: #166534;
            border: 1px solid #86efac;
        }

        .error-msg {
            background-color: #fee2e2;
            color: #991b1b;
            border: 1px solid #fca5a5;
        }

        .footer {
            text-align: center;
            padding: 15px;
            background-color: #f1f5f9;
            color: #64748b;
            font-size: 0.85rem;
            line-height: 1.7;
        }

        .footer .credit {
            display: block;
            margin-top: 4px;
            font-weight: 700;
            color: var(--navy);
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

<div class="form-container">
    <div class="header">
        <img src="Al Safwa.png" alt="شعار مدارس الصفوة الخاصة">
        <h1>مدرسة الصفوة الثانوية الخاصة</h1>
        <p>استمارة تسجيل بيانات الطلاب</p>
    </div>

    <div class="form-body">
        <form id="studentForm">
            <!-- اسم الطالب رباعي -->
            <div class="form-group">
                <label for="fullName">اسم الطالب رباعي <span class="required">*</span></label>
                <input type="text" id="fullName" name="fullName" class="form-control" placeholder="اكتب الاسم رباعياً باللغة العربية" required>
            </div>

            <!-- الفرقة الدراسية -->
            <div class="form-group">
                <label for="grade">الفرقة الدراسية <span class="required">*</span></label>
                <select id="grade" name="grade" class="form-control" required>
                    <option value="" disabled selected>-- اختر الفرقة الدراسية --</option>
                    <option value="الصف الثاني الثانوي بكالوريا">الصف الثاني الثانوي بكالوريا</option>
                    <option value="الصف الثالث الثانوي">الصف الثالث الثانوي</option>
                </select>
            </div>

            <!-- أقسام وأفرع الصف الثاني الثانوي بكالوريا -->
            <div id="sec2Box" class="sub-box">
                <div class="form-group">
                    <label for="department">أولاً: اختر القسم <span class="required">*</span></label>
                    <select id="department" name="department" class="form-control">
                        <option value="" disabled selected>-- اختر القسم --</option>
                        <option value="طب وعلوم حياة">طب وعلوم حياة</option>
                        <option value="علوم حاسب">علوم حاسب</option>
                        <option value="آداب وفنون">آداب وفنون</option>
                        <option value="إدارة أعمال">إدارة أعمال</option>
                    </select>
                </div>

                <div class="form-group" id="branchGroup" style="display: none; margin-bottom: 0;">
                    <label for="branch">ثانياً: اختر الفرع <span class="required">*</span></label>
                    <select id="branch" name="branch" class="form-control">
                        <option value="" disabled selected>-- اختر الفرع --</option>
                    </select>
                </div>
            </div>

            <!-- شعبة الصف الثالث الثانوي -->
            <div id="sec3Box" class="sub-box">
                <div class="form-group" style="margin-bottom: 0;">
                    <label for="section">اختر الشعبة <span class="required">*</span></label>
                    <select id="section" name="section" class="form-control">
                        <option value="" disabled selected>-- اختر الشعبة --</option>
                        <option value="علم علوم">علم علوم</option>
                        <option value="علم رياضة">علم رياضة</option>
                    </select>
                </div>
            </div>

            <!-- رقم الموبايل -->
            <div class="form-group">
                <label for="phone">رقم موبايل الطالب أو ولي الأمر <span class="required">*</span></label>
                <input type="tel" id="phone" name="phone" class="form-control" placeholder="01xxxxxxxxx" pattern="^01[0125][0-9]{8}$" required>
            </div>

            <button type="submit" id="submitBtn" class="btn-submit">تسجيل البيانات</button>

            <div id="successMsg" class="status-msg success-msg">
                تم تسجيل بياناتك بنجاح في مدرسة الصفوة الثانوية الخاصة!
            </div>
            <div id="errorMsg" class="status-msg error-msg">
                حدث خطأ أثناء إرسال البيانات، برجاء المحاولة مرة أخرى.
            </div>
        </form>
    </div>

    <div class="footer">
        مدرسة الصفوة الثانوية الخاصة &copy; 2026
        <span class="credit">بواسطة م / احمد فرغلي</span>
    </div>
</div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx6QuU6Yy5AgAMgihlfRU5vtLD9sRBXhrkonff29YGnlynd_ojmrlBS2Iow07hWyNeFMg/exec";

    const branchesByDepartment = {
        "طب وعلوم حياة": ["فيزياء", "رياضة"],
        "علوم حاسب": ["برمجة", "كيمياء"],
        "آداب وفنون": ["علم نفس", "لغة ثانية"],
        "إدارة أعمال": ["محاسبة", "إدارة أعمال"]
    };

    const form = document.getElementById("studentForm");
    const gradeSelect = document.getElementById("grade");

    const sec2Box = document.getElementById("sec2Box");
    const departmentSelect = document.getElementById("department");
    const branchGroup = document.getElementById("branchGroup");
    const branchSelect = document.getElementById("branch");

    const sec3Box = document.getElementById("sec3Box");
    const sectionSelect = document.getElementById("section");

    const submitBtn = document.getElementById("submitBtn");
    const successMsg = document.getElementById("successMsg");
    const errorMsg = document.getElementById("errorMsg");

    function resetBranch() {
        branchSelect.innerHTML = '<option value="" disabled selected>-- اختر الفرع --</option>';
        branchSelect.required = false;
        branchGroup.style.display = "none";
    }

    function resetSec2() {
        sec2Box.classList.remove("active");
        departmentSelect.value = "";
        departmentSelect.required = false;
        resetBranch();
    }

    function resetSec3() {
        sec3Box.classList.remove("active");
        sectionSelect.value = "";
        sectionSelect.required = false;
    }

    gradeSelect.addEventListener("change", function() {
        resetSec2();
        resetSec3();

        if (this.value === "الصف الثاني الثانوي بكالوريا") {
            sec2Box.classList.add("active");
            departmentSelect.required = true;
        } else if (this.value === "الصف الثالث الثانوي") {
            sec3Box.classList.add("active");
            sectionSelect.required = true;
        }
    });

    departmentSelect.addEventListener("change", function() {
        const selectedDept = this.value;
        resetBranch();

        if (branchesByDepartment[selectedDept]) {
            branchesByDepartment[selectedDept].forEach(branchName => {
                const option = document.createElement("option");
                option.value = branchName;
                option.textContent = branchName;
                branchSelect.appendChild(option);
            });
            branchSelect.required = true;
            branchGroup.style.display = "block";
        }
    });

    form.addEventListener("submit", async function(e) {
        e.preventDefault();

        successMsg.style.display = "none";
        errorMsg.style.display = "none";
        submitBtn.disabled = true;
        submitBtn.textContent = "جاري التسجيل...";

        const formData = new FormData(form);
        const grade = formData.get("grade");
        const isSec2 = grade === "الصف الثاني الثانوي بكالوريا";
        const isSec3 = grade === "الصف الثالث الثانوي";

        const params = new URLSearchParams({
            fullName: formData.get("fullName").trim(),
            grade: grade,
            sectionOrDept: isSec2 ? formData.get("department") : (isSec3 ? formData.get("section") : ""),
            branch: isSec2 ? formData.get("branch") : "",
            phone: formData.get("phone").trim()
        });

        try {
            await fetch(`${SCRIPT_URL}?${params.toString()}`, {
                method: "GET",
                mode: "no-cors"
            });

            successMsg.style.display = "block";
            form.reset();
            resetSec2();
            resetSec3();
        } catch (err) {
            console.error("Submit error:", err);
            errorMsg.style.display = "block";
        } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = "تسجيل البيانات";
        }
    });
</script>

</body>
</html>
